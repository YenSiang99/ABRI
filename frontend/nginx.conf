# The frontend container's own nginx. It serves the SPA and proxies only the
# crawler-facing SEO endpoints; the host nginx still owns /api routing.
map $host $abri_backend {
    ~^dev[.]abri[.]asia$ backend-dev:4000;
    default backend-prod:4000;
}

map $http_user_agent $abri_crawler {
    default 0;
    ~*(facebookexternalhit|facebot|twitterbot|linkedinbot|slackbot|discordbot|whatsapp|telegrambot|googlebot|bingbot|applebot|bytespider|gptbot|claudebot|perplexitybot|ccbot|yandexbot) 1;
}

server {
    resolver 127.0.0.11 valid=30s;

    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints these filenames, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy ships stale asset refs.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sitemap.xml {
        proxy_pass http://$abri_backend/seo/sitemap.xml;
    }

    location ~ ^/sitemaps/.+[.]xml$ {
        proxy_pass http://$abri_backend/seo$request_uri;
    }

    # Social networks and AI/search crawlers do not consistently execute a
    # client-rendered React route. They receive the same canonical URL plus a
    # server-generated preview document containing public profile metadata.
    location ~ ^/business/[^/]+$ {
        error_page 418 = @business_share;
        if ($abri_crawler) {
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }

    location @business_share {
        proxy_pass http://$abri_backend/seo/share$request_uri;
    }

    location ~ ^/m/([^/]+)$ {
        set $shared_business_id $1;
        error_page 418 = @card_share;
        if ($abri_crawler) {
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }

    location @card_share {
        proxy_pass http://$abri_backend/seo/share/business/$shared_business_id;
    }

    # react-router owns the routing; every unknown path is the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
