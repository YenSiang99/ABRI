# The frontend container's own nginx. It only ever serves static files: the
# host's nginx terminates TLS and routes /api/ straight to the backend
# container, so nothing here needs to know the API exists.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints these filenames, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy ships stale asset refs.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # react-router owns the routing; every unknown path is the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
