# The dev job. Every push to main builds images on a GitHub runner, pushes them
# to ghcr.io, and tells the EC2 host to pull — the host never builds anything
# itself, because it's a t3.micro with 913 MiB of RAM and a Vite build peaks
# around 1.5 GB.
name: Deploy dev

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. Two concurrent runs would race on `docker compose up`
# and could leave dev running an older image than the newer run just pushed.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  # Lowercase because ghcr.io rejects uppercase path segments, and the owner is
  # "YenSiang99". Must stay in step with deploy/docker-compose.yml.
  IMAGE_PREFIX: ghcr.io/yensiang99/abri

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          # The :dev tag is what the dev containers run. The immutable
          # :sha- tag is what the prod job later promotes, so prod ships the
          # exact bytes dev proved rather than a fresh rebuild of the same code.
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:dev
            ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          # A pinned host key, not StrictHostKeyChecking=no: every runner is a
          # fresh machine, so trust-on-first-use here would mean trusting
          # whatever answers on port 22, every single run.
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Sync the compose file
        run: |
          scp -i ~/.ssh/deploy_key deploy/docker-compose.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/abri/deploy/docker-compose.yml"

      - name: Pull and restart dev
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" <<'REMOTE'
          set -euo pipefail
          cd /srv/abri/deploy
          docker compose pull backend-dev frontend-dev
          docker compose up -d backend-dev frontend-dev
          # 3.0 GB free on an 8 GB disk. Untagged layers from the previous build
          # are the fastest way to lose it.
          docker image prune -f
          REMOTE

      - name: Smoke check
        run: |
          # The backend entrypoint runs `prisma migrate deploy` before it binds,
          # so allow well over a cold start before calling it a failure.
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 https://dev.abri.asia/api/health/db | grep -q '"status":"ok"'; then
              echo "dev is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "::error::dev.abri.asia did not report healthy within 150s"
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'docker logs --tail 50 abri-backend-dev' || true
          exit 1
