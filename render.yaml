services:
  - type: web
    name: abri-backend
    runtime: node
    plan: free
    rootDir: backend
    # `migrate deploy` applies any pending migrations before the new code
    # goes live. Without it a deploy that changes the schema ships code
    # against the old tables — and since Vouch reads join through
    # currentRevision (see lib/accountView.js), that breaks login and the
    # public profile, not just the feature being added. Safe to run every
    # time: it's a no-op when the database is already up to date, and a
    # failure here fails the build, leaving the previous instance serving.
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      # Neon connection strings — Neon dashboard → Connect → "Prisma" tab.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Signs auth session cookies. Render generates a random value on
      # first deploy; rotate it in the dashboard if it's ever exposed.
      - key: JWT_SECRET
        generateValue: true
      # Your Vercel production domain (e.g. https://abri.vercel.app) —
      # needed so the backend's CORS config trusts cookies from it.
      - key: FRONTEND_URL
        sync: false
